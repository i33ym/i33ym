<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}i33ym{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
            color: #2c2c2c;
            background-color: #fafafa;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header h1 a {
            color: #2c2c2c;
            text-decoration: none;
        }

        header nav {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

        header nav a {
            color: #666;
            text-decoration: none;
            margin-right: 20px;
        }

        header nav a:hover {
            color: #2c2c2c;
        }

        main {
            min-height: 60vh;
        }

        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #888;
        }

        a {
            color: #2c2c2c;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="/">i33ym</a></h1>
            <nav>
                <a href="/">essays</a>
                <a href="{% url 'subscribers:subscribe' %}">subscribe</a>
                <a href="{% url 'articles:about' %}">about</a>
                {% if user.is_authenticated %}
                    <a href="/accounts/2fa/">security</a>
                    <a href="{% url 'account_logout' %}">logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}">login</a>
                {% endif %}
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>&copy; 2025 i33ym. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
